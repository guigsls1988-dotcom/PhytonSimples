name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt bandit pip-audit
      - run: ruff check app tests
      - run: pytest -q
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt
      - run: docker build -t tor-ip-aggregator:${{ github.sha }} .
